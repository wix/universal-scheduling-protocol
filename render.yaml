## Render Infrastructure-as-Code Blueprint
## https://render.com/docs/blueprint-spec
##
## Deploy: connect this repo in Render dashboard → it auto-detects render.yaml.
## Or use the Render CLI: `render blueprint apply`

services:
  - type: web
    runtime: static
    name: usp-dev
    repo: https://github.com/wix-private/universal-scheduling-protocol-spec
    branch: master
    buildCommand: pip install -r requirements.txt && mkdocs build
    staticPublishPath: ./site
    pullRequestPreviewsEnabled: true
    buildFilter:
      paths:
        - site-docs/**
        - overrides/**
        - mkdocs.yml
        - requirements.txt
        - docs/**
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENABLE_EXPERIMENTAL_COREPACK
        value: "1"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /playground/scenarios/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /spec
        destination: /specification/
      - type: rewrite
        source: /spec/*
        destination: /specification/*
      - type: redirect
        source: /github
        destination: https://github.com/wix-private/universal-scheduling-protocol-spec
