# Mirror private master to the public Wix repo.
# Requires repository secret PUBLIC_MIRROR_TOKEN: a PAT (or fine-grained
# token) with Contents: Write on wix/universal-scheduling-protocol.
name: mirror-to-public

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    # Must not run on the public mirror itself (workflow file is mirrored).
    if: github.repository == 'wix-private/universal-scheduling-protocol-spec'
    # Must stay self-hosted: GitHub-hosted runners are not permitted in this
    # organisation (same constraint as ci.yml).
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push master to wix/universal-scheduling-protocol
        env:
          PUBLIC_MIRROR_TOKEN: ${{ secrets.PUBLIC_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_MIRROR_TOKEN:-}" ]; then
            echo "Missing secret PUBLIC_MIRROR_TOKEN." >&2
            echo "Create a PAT with Contents: Write on wix/universal-scheduling-protocol," >&2
            echo "then add it as a repository secret named PUBLIC_MIRROR_TOKEN." >&2
            exit 1
          fi
          git remote remove public 2>/dev/null || true
          git remote add public "https://x-access-token:${PUBLIC_MIRROR_TOKEN}@github.com/wix/universal-scheduling-protocol.git"
          # Mirror the checked-out master tip. Force is required for the first
          # push into an empty repo and keeps the public branch identical to
          # private master (same outcome as the prior dual-pushurl local mirror).
          git push public "HEAD:refs/heads/master" --force
