name: ci

on:
  # Only master on push: a pull_request event already covers branch commits, and
  # listening to both made every PR commit run this job twice.
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Workflow file is mirrored to the public Wix repo; skip there so public
    # Actions do not request self-hosted runners that only exist for wix-private.
    if: github.repository == 'wix-private/universal-scheduling-protocol-spec'
    # Must stay self-hosted: GitHub-hosted runners are not permitted in this
    # organisation, and devex-gha-authority cancels any job that requests one.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install check dependencies
        run: pip install -r requirements-dev.txt

      # Every JSON artefact parses, every schemas/ file compiles as a JSON
      # Schema, and the version literal agrees across the artefacts that
      # assert this repository's version identity.
      - name: Validate schemas
        run: python tools/usp_check.py schemas

      # Every $ref resolves the same way under $id base-URI rules and on the
      # filesystem. The published $id values carry directory segments the flat
      # schemas/ layout does not have, so a cross-level $ref can validate in an
      # IDE and break in any $id-honouring validator.
      - name: Validate cross-file references
        run: python tools/usp_check.py refs

      # Canonicalization and proof vectors round-trip, and their error codes
      # are reachable from the normative text.
      - name: Validate test vectors
        run: python tools/usp_check.py vectors

      # Not --strict: site-docs deliberately links to repository files that sit
      # outside docs_dir (specification.md, schemas/, openapi/, openrpc/), which
      # resolve on GitHub but not in mkdocs. Seven such links exist today, so
      # --strict would make this job red permanently for a design choice rather
      # than a defect.
      - name: Build docs
        run: |
          pip install -r requirements.txt
          npm run build

      # The authority check runs after the site build so it can verify origin
      # binding, namespace names, canonical artifact paths, problem pages,
      # playground mirrors, and stale-identifier absence in one pass.
      - name: Validate authority publication
        run: python tools/usp_check.py authority
