<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#134e4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d9488"/>
      <stop offset="100%" style="stop-color:#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="50%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:0.15"/>
      <stop offset="60%" style="stop-color:#0d9488;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="40%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:0.1"/>
      <stop offset="60%" style="stop-color:#2dd4bf;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#fff" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Calendar-clock icon -->
  <g transform="translate(100, 170)" opacity="0.9">
    <!-- Calendar body -->
    <rect x="0" y="16" width="80" height="72" rx="8" fill="none" stroke="#2dd4bf" stroke-width="3"/>
    <!-- Calendar top hooks -->
    <line x1="22" y1="6" x2="22" y2="26" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <line x1="58" y1="6" x2="58" y2="26" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
    <!-- Calendar header line -->
    <line x1="0" y1="40" x2="80" y2="40" stroke="#2dd4bf" stroke-width="3"/>
    <!-- Clock circle -->
    <circle cx="62" cy="70" r="22" fill="#0f172a" stroke="#14b8a6" stroke-width="3"/>
    <!-- Clock hands -->
    <line x1="62" y1="70" x2="62" y2="56" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="62" y1="70" x2="74" y2="70" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Clock center dot -->
    <circle cx="62" cy="70" r="2.5" fill="#2dd4bf"/>
  </g>

  <!-- Badge -->
  <g transform="translate(100, 130)">
    <rect width="240" height="30" rx="15" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="120" y="20" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" letter-spacing="0.5">
      OPEN STANDARD · v2026-02-21
    </text>
  </g>

  <!-- Title -->
  <text x="100" y="320" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Universal Scheduling
  </text>
  <text x="100" y="385" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Protocol
  </text>

  <!-- Tagline -->
  <text x="100" y="435" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500" fill="#2dd4bf">
    The open standard for agentic scheduling.
  </text>

  <!-- Description -->
  <text x="100" y="475" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#94a3b8">
    Discover, check availability, and book time-based services.
  </text>

  <!-- Bottom bar — verticals -->
  <g transform="translate(100, 530)">
    <!-- Pill: Appointments -->
    <rect x="0" y="0" width="130" height="32" rx="6" fill="rgba(13,148,136,0.15)" stroke="rgba(13,148,136,0.3)" stroke-width="1"/>
    <text x="65" y="21" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2dd4bf">Appointments</text>

    <!-- Pill: Groups -->
    <rect x="145" y="0" width="90" height="32" rx="6" fill="rgba(13,148,136,0.15)" stroke="rgba(13,148,136,0.3)" stroke-width="1"/>
    <text x="190" y="21" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2dd4bf">Groups</text>

    <!-- Pill: Reservations -->
    <rect x="250" y="0" width="125" height="32" rx="6" fill="rgba(13,148,136,0.15)" stroke="rgba(13,148,136,0.3)" stroke-width="1"/>
    <text x="312" y="21" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2dd4bf">Reservations</text>

    <!-- Pill: Rentals -->
    <rect x="390" y="0" width="90" height="32" rx="6" fill="rgba(13,148,136,0.15)" stroke="rgba(13,148,136,0.3)" stroke-width="1"/>
    <text x="435" y="21" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2dd4bf">Rentals</text>
  </g>

  <!-- Right side — transport binding icons -->
  <g transform="translate(780, 170)" opacity="0.6">
    <!-- REST -->
    <rect x="0" y="0" width="160" height="44" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="80" y="28" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#94a3b8">REST · MCP</text>

    <!-- A2A -->
    <rect x="175" y="0" width="160" height="44" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="255" y="28" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#94a3b8">A2A · ESP</text>
  </g>

  <!-- Right side — code snippet preview -->
  <g transform="translate(780, 235)">
    <rect width="335" height="260" rx="10" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <!-- Code header -->
    <rect width="335" height="36" rx="10" fill="rgba(255,255,255,0.03)"/>
    <rect y="26" width="335" height="10" fill="rgba(0,0,0,0.3)"/>
    <!-- Dots -->
    <circle cx="20" cy="18" r="5" fill="#ef4444" opacity="0.6"/>
    <circle cx="38" cy="18" r="5" fill="#eab308" opacity="0.6"/>
    <circle cx="56" cy="18" r="5" fill="#22c55e" opacity="0.6"/>
    <text x="170" y="22" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748b">POST /bookings</text>

    <!-- Code lines -->
    <text x="20" y="62" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#64748b">{</text>
    <text x="36" y="80" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#94a3b8">"service_id"</text>
    <text x="148" y="80" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#64748b">:</text>
    <text x="158" y="80" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#2dd4bf">"svc_haircut_001"</text>
    <text x="36" y="100" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#94a3b8">"slot_id"</text>
    <text x="122" y="100" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#64748b">:</text>
    <text x="132" y="100" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#2dd4bf">"slot_0315_0900"</text>
    <text x="36" y="120" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#94a3b8">"buyer"</text>
    <text x="100" y="120" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#64748b">: {</text>
    <text x="52" y="140" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#94a3b8">"name"</text>
    <text x="102" y="140" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#64748b">:</text>
    <text x="112" y="140" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#2dd4bf">"Alice Williams"</text>
    <text x="52" y="160" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#94a3b8">"email"</text>
    <text x="108" y="160" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#64748b">:</text>
    <text x="118" y="160" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#2dd4bf">"alice@example"</text>
    <text x="36" y="180" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#64748b">}</text>
    <text x="36" y="200" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#94a3b8">"party_size"</text>
    <text x="148" y="200" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#64748b">:</text>
    <text x="158" y="200" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#f59e0b">1</text>
    <text x="20" y="220" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#64748b">}</text>

    <!-- Response indicator -->
    <g transform="translate(20, 235)">
      <rect width="52" height="18" rx="4" fill="rgba(34,197,94,0.15)"/>
      <text x="26" y="13" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#22c55e">200</text>
      <text x="62" y="13" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748b">confirmed</text>
    </g>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accent)"/>

  <!-- usp.dev watermark -->
  <text x="1100" y="600" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600" fill="rgba(255,255,255,0.25)">usp.dev</text>
</svg>
